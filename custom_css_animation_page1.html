<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCode Export</title>
    
    <!-- ============================================ -->
    <!-- CSS CODE (from the CSS editor)               -->
    <!-- ============================================ -->
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09090b;
    font-family: Arial, Helvetica, sans-serif;
}

.scene {
    text-align: center;
}

.fire {
    position: relative;
    width: 180px;
    height: 240px;
    margin: 0 auto 35px;
    filter: drop-shadow(0 0 25px #ff4500);
}

.flame {
    position: absolute;
    bottom: 0;
    left: 50%;
    border-radius: 50% 0 50% 50%;
    transform: translateX(-50%) rotate(-45deg);
    transform-origin: center bottom;
}

.flame1 {
    width: 150px;
    height: 150px;
    background: #ff2a00;
    animation: burn 1.4s ease-in-out infinite alternate;
}

.flame2 {
    width: 120px;
    height: 190px;
    background: #ff6a00;
    animation: burn 1.1s ease-in-out infinite alternate-reverse;
}

.flame3 {
    width: 90px;
    height: 145px;
    background: #ffb000;
    animation: burn 0.9s ease-in-out infinite alternate;
}

.flame4 {
    width: 55px;
    height: 105px;
    background: #ffe600;
    animation: burn 0.7s ease-in-out infinite alternate-reverse;
}

.core {
    position: absolute;
    width: 35px;
    height: 65px;
    left: 50%;
    bottom: 12px;
    background: #fff7c2;
    border-radius: 50% 0 50% 50%;
    transform: translateX(-50%) rotate(-45deg);
    box-shadow: 0 0 20px #fff,
                0 0 40px #ffd000;
}


@keyframes burn {
    0% {
        transform: translateX(-50%) rotate(-45deg) scale(1) skew(0deg);
    }
    50% {
        transform: translateX(-52%) rotate(-47deg) scale(1.08 0.95) skew(3deg);
    }
    100% {
        transform: translateX(-48%) rotate(-42deg) scale(0.95, 1.08) skew(-3deg);
    }
}

h2 {
    color: #fff;
    font-size: 22px;
    letter-spacing: 5px;
    text-shadow: 0 0 10px #ff6a00
                 0 0 20px #ff4500;

}
    </style>
    <!-- ============================================ -->
    
</head>
<body>
    <!-- ============================================ -->
    <!-- HTML CODE (from the HTML editor)             -->
    <!-- ============================================ -->
<div class="scene">
    <div class="fire">
        <div class="flame flame1"></div>
        <div class="flame flame2"></div>
        <div class="flame flame3"></div>
        <div class="flame flame4"></div>
        <div class="core"></div>
    </div>
    <h2>PURE CSS FIRE</h2>
</div>
    <!-- ============================================ -->
    
    <!-- ============================================ -->
    <!-- JAVASCRIPT CODE (from the JS editor)         -->
    <!-- ============================================ -->
    <script>

    </script>
    <!-- ============================================ -->
    
</body>
</html>
