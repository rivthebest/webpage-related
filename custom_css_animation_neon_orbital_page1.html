<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- ============================================ -->
    <!-- CSS CODE (from the CSS editor)               -->

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
    padding: 20px;
    zoom: 0.6;
    
}

.neon-orbital {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.neon-orbital .ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid transparent;
    mix-blend-mode: screen;
}

.neon-orbital .ring:nth-child(1) {
    border-top: 4px solid #0ff;
    border-left: 4px solid #0ff;
    border-right: 4px solid #0ff;
    border-bottom: 4px solid #0ff;
    animation: spin-3d 2s linear infinite reverse;
    box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff;
}

.neon-orbital .ring:nth-child(2) {
    border-top: 4px solid #f0f;
    border-left: 4px solid #f0f;
  	border-right: 4px solid #f0f;
    border-bottom: 4px solid #f0f;
    animation: spin-3d 2.5s linear infinite reverse;
    box-shadow: 0 0 20px #f0f, inset 0 0 20px #f0f;
}

.neon-orbital .ring:nth-child(3) {
    border-top: 4px solid #ff0;
    border-left: 4px solid #ff0;
    border-right: 4px solid #ff0;
    border-bottom: 4px solid #ff0;
    animation: spin-3d 1.5s linear infinite reverse ;
    box-shadow: 0 0 20px #ff0, inset 20px #ff0;
}

@keyframes spin-3d {
    0% { transform: rotate3d(1, 1, 1, 0deg); }
    100% { transform: rotate3d(1, 1, 1, 360deg);}
}
    </style>
    <!-- ============================================ -->
    
</head>
<body>
    <!-- ============================================ -->
    <!-- HTML CODE (from the HTML editor)             -->
    <!-- ============================================ -->
<div class="neon-orbital">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
</div>
