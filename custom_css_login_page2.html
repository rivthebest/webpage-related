<!DOCTYPE html>

    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
  height: 200vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: #0f172a;
  position: relative;
  zoom: 0.5;
}

/* Animated Background */
body::before { 
  	content: "";
    position: absolute;
    width: 500px;
  	height: 500px;
    background: linear-gradient(#ff00cc, #3333ff);
    border-radius: 50%;
  	top:-300px;
    left:-320px;
    filter: blur(40px);
    animation: move 8s infinite alternate;
}

body::after {
  	content: "";
    position: absolute;
    width: 450px;
    height: 450px;
  	background: linear-gradient(#00f2fe, #4facfe);
    border-radius: 50%;
  	bottom: -300px;
  	right: -300px;
    filter: blur(40px);
    animation: move2 8s infinite alternate;
}

@keyframes move {
    100% { transform: translate(40px, 50px); }
}

@keyframes move2 {
    100% { transform: translate(-50px, -30px); }
}

/* Glass Card */
.login-container {
    position: relative;
    width: 400px;
  	padding: 45px 35px;
  	border-radius: 30px;
    background: rgba(255, 255, 255, 0.08);
  	border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(25px);
 /* 	box-shadow: 0 8px 32px rgba(0,0,0,0.4)
                inset 0 0 20px rgba(255, 255, 255, 0.05); */
    box-shadow:0 0 15px rgba(0, 242, 254, 0.5);
  	z-index: 10;
}


/* Glow Border 
.login-container::before {
		content: "";
    position: absolute;
  	inset: 0;
    border-radius: 30px;
    padding: 2px;
  	background: linear-gradient(45deg, #00f2fe, #ff00cc, #4facfe);
 	-webkit-mask: linear-gradient(#fff, 0, 0) content-box,linear-gradient(#fff, 0, 0); 
  mask: linear-gradient(#fff, 0, 0) content-box, linear-gradient(#fff, 0, 0);
  	-webkit-mask-composite: xor; 
  	mask-composite: exclude; 
}

*/

/* Heading */
.login-container h2 {
    color: #fff;
    font-size: 38px;
  	text-align: center;
    margin-bottom: 10px;
    font-weight: 700;
}

.login-container p{
    color: #cbd5e1;
    text-align: center;
    margin-bottom: 35px;
    font-size: 15px;
}

/*Input */

.input-box {
    position: relative;
    margin-bottom: 25px;
}

.input-box input {
    width: 100%;
    padding: 18px 20px;
    border: none;
    outline: none;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 15px;
    transition: 0.4s;
}

.input-box input:focus {
    border-color: #00f2fe;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
}

.input-box input::placeholder {
    color: #cbd5e1;
    
}

/*Options */
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    color: #fff;
    font-size: 14px;
}

.options a {
    color: #00f2fe;
    text-decoration: none;
}

.options a:hover {
    text-decoration: underline;
}

/* Button */
.btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #00f2fe, #ff00cc);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.4s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.btn:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 15px 25px rgba(255, 0, 204, 0.4);
}

/*Bottom */

.bottom-text {
    text-align: center;
    color: #cbd5e1;
    margin-top: 25px;
    font-size: 14px;
}

.bottom-text a {
    color: #00f2fe;
    text-decoration: none;
    font-weight: 600;
}

.bottom-text a:hover {
  	text-decoration: underline;
}



    </style>
    <!-- ============================================ -->
    
</head>
<body>
    <!-- ============================================ -->
    <!-- HTML CODE (from the HTML editor)             -->

<div class="login-container">
  <h2>Sign In</h2>
  <p>Access your account securely</p>
  <form>
    <div class="input-box">
            <input type="email" 
                   placeholder="Email Address"
                   required>
     </div>
    <div class="input-box">
            <input type="password"
                   placeholder="Password"
                   required>
    </div>
    <div class="options">
            <label>
                <input type="checkbox">Remember
            </label>
            <a href="#">Forgot Password</a>
     </div>
    <button class="btn">
            Login Now
    </button>
    <div class="bottom-text">
            Don't have an account?
            <a href="#">Create Account</a>
     </div>
  </form>
</div>
