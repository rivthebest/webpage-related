<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCode Export</title>
    
    <!-- ============================================ -->
    <!-- CSS CODE (from the CSS editor)               -->
    <!-- ============================================ -->
    <style>
.perspective-250 {
    perspective: 250px;
}
.perspective-350 {
    perspective: 350px;
}

.perspective-500 {
    perspective: 500px;
}

.perspective-650 {
    perspective: 650px;
}

.container {
    width: 200px;
    height: 200px;
    margin: 75px 0 0 75px;
    border: none;
}

.cube {
    width: 100%;
    height: 100%;
    perspective-origin: 150% 150%;
    transform-style: preserve-3d;
}

.face {
    display: block;
    position: absolute;
    width: 100px;
    height: 100px;
    border: none;
    line-height: 100px;
    font-family: sans-serif;
    font-size: 60px;
    color: white;
    text-align: center;
    backface-visibility: visible;
}

.front {
    background: rgb(0 0 0 / 30%);
    transform: translateZ(50px);
}

.back {
    background: lime;
    color: black;
    transform: rotateY(180deg) translateZ(50px);
}

.right {
    background: rgb(196 0 0 / 70%);
    transform: rotateY(90deg) translateZ(50px);
}
.left {
    background: rgb(0 0 196 / 70%);
    transform: rotateY(-90deg) translateZ(50px);
}

.top {
    background: rgb(196 196 0 / 70%);
    transform: rotateX(90deg) translateZ(50px);
}

.bottom {
    background: rgb(196 0 196 / 70%);
    transform: rotateX(-90deg) translateZ(50px);
}

th, p, td {
    background-color: #eeeeee;
    padding: 10px;
    font-family: sans-serif;
    text-align: left;
}
    </style>
    <!-- ============================================ -->
    
</head>
<body>
