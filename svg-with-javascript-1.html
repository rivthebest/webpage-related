<html>
    <head>
        <style>
            :root {
    --_white: #fff;
    --_gray: #212124;
    --c-txt: var(--_gray);
    --c-bg: var(--_white);
    @media (prefers-color-scheme: dark) {
            --c-txt: var(--_white);
            --c-bg: var(--_gray);
    }
}

body {
    color: var(--c-txt);
    background: var(--c-bg);
    padding: 10vmin;
}

figure {
    text-align: center;
}

figcaption {
    margin-top: 0.6em;
    font-style: italic;
}

svg {
    box-shadow: 0 0 0.2em 1em 0 color-mix(in srgb, var(--c-txt) 10%, var(--c-bg));
}


        </style>
        <script type="text/javascript">
           function callSVG() {
             // vars

               const rectFill = "currentColor";
               const container = document.querySelector("[data-svg-container]");
               const svgWidth = "50vmin";
               const rectDocWidth = 200;
               const rectDocHeight = 200;
               const docOffset = 15;
               const rectSize = rectDocWidth / 2 - docOffset * 2;
               const roundedCornerRadius = 10;
               const circleLookRadius = rectSize / 2;
               const ellipticalRy = roundedCornerRadius * 2;
               const title = 
               "Four Rectangles of Different Qualities Placed in each quadrant";

               // create SVG as proper DOM element
               const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
               svg.setAttribute("width", svgWidth);
               svg.setAttribute("viewBox", `0 0 ${rectDocWidth} ${rectDocHeight}`);
               svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
               svg.setAttribute("role", "img");

               // append innerHTML as string
               svg.innerHTML = `
                    <title>${title}</title>
                    <rect
                        x=${docOffset}
                        y=${docOffset}
                        width=${rectSize} 
                        height=${rectSize}
                        fill=${rectFill} 
                    />                    
                    <rect 
                        x=${rectDocWidth - rectSize - docOffset}
                        rx=${roundedCornerRadius}
                        y=${docOffset}
                        width=${rectSize}
                        height=${rectSize}
                        fill=${rectFill}
                    />
                    <rect 
                        x=${docOffset}
                        rx=${circleLookRadius}
                        y=${rectDocHeight - rectSize - docOffset}
                        width=${rectSize}
                        height=${rectSize}
                        fill=${rectFill}
                    />
                    <rect 
                        x=${rectDocWidth - rectSize - docOffset}
                        rx=${roundedCornerRadius}
                        ry=${ellipticalRy}
                        y=${rectDocHeight - rectSize - docOffset}
                        width=${rectSize}
                        height=${rectSize}
                        fill=${rectFill}
                    />
                `;

               container.appendChild(svg);
           }
        </script>
    </head>
    <body onload="callSVG();">
        <figure>
            <div data-svg-container></div>
        </figure>

    </body>
</html>
