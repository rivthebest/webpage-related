<html>
    <head>
        <style>
            .cartoon {
                width: 50vmin;
                height: 50vmin;
                background: #f002;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background:

                /* background hair */
                radial-gradient(farthest-side at 55% 0%,#fff 21% 30%,#0000 0) 92% 18% / 60% 10%,
                radial-gradient(farthest-side at 55% 0%,black 21% 30%,#0000 0) 90% 20% / 60% 15%,

                radial-gradient(farthest-side at 55% 0%,#fff 21% 30%,#0000 0) 13% 17% / 50% 8%,
                radial-gradient(farthest-side at 55% 0%,black 21% 30%,#0000 0) 7% 19% / 60% 15%,
                
                radial-gradient(farthest-side at 55% 0%,#fff 21% 30%,#0000 0) 10% 19% / 50% 8%,
                radial-gradient(farthest-side at 55% 0%,black 21% 30%,#0000 0) 4% 21% / 60% 15%,

                /* ears */
                radial-gradient(circle at 15% 55%,#0000 9%,black 0 calc(9% + 2px),transparent 0),
                radial-gradient(circle at 19% 58%,white 4%,black 0 calc(5% + 2px),transparent 0),
                radial-gradient(circle at 83% 55%,#0000 8%,black 0 calc(8% + 2px),transparent 0),
                radial-gradient(circle at 80% 57%,white 5%,black 0 calc(5% + 2px),transparent 0);

                background-repeat: no-repeat;
                background-color: #fff;
            }

            .cartoon::before {
                content: "";
                width: 35vmin;
                height: 40vmin;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border: 2px solid;
                border-radius: 90% / 145% 140% 30% 30%;
                background:
                    /* hair top */                    
                    radial-gradient(120% 50% at 70% 0%,black 29%, #0000 30%),
                    radial-gradient(80% 50% at 20% 0%,black 29%, #0000 30%),
                    radial-gradient(120% 50% at 75% 2%,white 29%, #0000 30%),
                    radial-gradient(120% 50% at 69% 2.125%,black 29%, #0000 30%),
                    
                    /* Chin & Lip */                    
                    radial-gradient(at 20% 80%,white 22%,black 0 calc(22% + 2px),#0000 0) 59% 90% / 6% 7%,
                    linear-gradient(-45deg,#0000 50%,black 0 calc(50% + 2px),#0000 0) 58% 83% / 6% 6%,
                    radial-gradient(circle at 0% 90%,white 9%,black 0,calc(9% + 2px),transparent 0) 110% calc(100% + 2px) / 50% 92%,
                    
                    /* Beard */                    
                    radial-gradient(circle,#000 50%,#0000 0) 50% 90% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 40% 87% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 30% 95% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 20% 83% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 10% 90% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 45% 82% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 45% 97% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 35% 88% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 25% 89% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 15% 93% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 9% 83% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 33% 81% / 1.5% 1.5%,                  
                    radial-gradient(circle,#000 50%,#0000 0) 65% 97% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 85% 88% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 95% 89% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 75% 93% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 68% 83% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 78% 81% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 89% 87% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 99% 81% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 82% 94% / 1.5% 1.5%,
                    radial-gradient(circle,#000 50%,#0000 0) 76% 88% / 1.5% 1.5%;
                    
                background-repeat: no-repeat;
                background-color: #fff;
            }

            .cartoon::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background:

                    /* Eyebrows */                     
                    radial-gradient(farthest-side at 50% 100%,#000 50%,#0000 0) 33% 37% / 40% 10%,
                    radial-gradient(farthest-side at 50% 100%,#000 50%,#0000 0) 33% 37% / 44% 9%,
                    radial-gradient(farthest-side at 50% 100%,#000 50%,#0000 0) 80% 37% / 40% 10%,
                    radial-gradient(farthest-side at 50% 100%,#000 50%,#0000 0) 84% 37% / 44% 9%,
                    
                    /* Eyes */                    
                    radial-gradient(farthest-side,#fff 50%,#0000 0) 40% 49% / 4% 4%,
                    radial-gradient(farthest-side,#fff 50%,#0000 0) 67.5% 49% / 4% 4%,
                    radial-gradient(farthest-side,black 50%,#0000 0) 40% 50% / 12% 12%,
                    radial-gradient(farthest-side,black 50%,#0000 0) 70% 50% / 12% 12%,
                    
                    /* Nose */                    
                    radial-gradient(farthest-side at 50% 0%,#fff 50%,black 0 calc(50% + 2px),#0000 0) 56% 67% / 20% 7.5%,
                    radial-gradient(farthest-side at 50% 0%,#fff 50%,black 0 calc(50% + 2px),#0000 0) 47% 65% / 10% 3.75%,
                    radial-gradient(farthest-side at 50% 0%,#fff 50%,black 0 calc(50% + 2px),#0000 0) 62% 65% / 8% 3.75%,
                    radial-gradient(farthest-side at 0% 90%,#fff 50%,black 0 calc(50% + 2px),#0000 0) 61% 55% / 10% 20%,
                    
                    /* Mustache */                    
                    radial-gradient(farthest-side at 50% 100%,black 59%,#0000 60%) 71% 65% / 80% 10%,
                    radial-gradient(farthest-side at 50% 0%,black 59%,#0000 60%) 120% 75% / 80% 10%,
                    radial-gradient(farthest-side at 50% 0%,black 59%,#0000 60%) 5% 75% / 80% 10%;
                    
            
                background-repeat: no-repeat;
                background-color: #00f1;
                
            }
        </style>
    </head>
    <body>
       <div role="image" class="cartoon" aria-label="Cartoon of a man with Mustache"></div>
    </body>
</html>
