<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCode Export</title>
    
    <!-- ============================================ -->
    <!-- CSS CODE (from the CSS editor)               -->
    <!-- ============================================ -->
    <style>
body {
    margin: 0px;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
}

.scene {
    width: 180px;
    height: 180px;
    perspective: 700px;
}

.cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spin 8s infinite linear;
}

.face {
    position: absolute;
    width: 180px;
    height: 180px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 3, 1fr;
    gap: 4px;
    padding: 4px;
    box-sizing: border-box;
}

.face div {
    border-radius: 6px;
}

.front { background: #000; transform: translateZ(90px);}
.back { background: #000; transform: rotateY(180deg) translateZ(90px);}
.right { background: #000; transform: rotateY(90deg) translateZ(90px);}
.left { background: #000; transform: rotateY(-90deg) translateZ(90px);}
.top { background: #000; transform: rotateX(90deg) translateZ(90px);}
.bottom { background: #000; transform: rotateX(-90deg) translateZ(90px);}

.front div {background: red;}
.back div {background: orange;}
.right div {background: blue;}
.left div {background: green;}
.top div {background: white;}
.bottom div {background: yellow;}

@keyframes spin {
    from { transform: rotateX(0deg) rotateY(180deg) rotateZ(270deg);}
    to { transform: rotateX(90deg) rotateY(270deg) rotateZ(360deg);}
}
    </style>
    <!-- ============================================ -->
    
</head>
<body>
    <!-- ============================================ -->
    <!-- HTML CODE (from the HTML editor)             -->
    <!-- ============================================ -->
