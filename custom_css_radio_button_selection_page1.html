<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCode Export</title>
    
    <!-- ============================================ -->
    <!-- CSS CODE (from the CSS editor)               -->
    <!-- ============================================ -->
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
    padding: 20px;
    zoom: 0.6;
    
}

.container {
    width: 100%;
    max-width: 500px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    color: #fff;
    
}

.container h2 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 34px;
    background: linear-gradient(to right, #38bdf8, #8b5cf6, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.container p {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 35px;
    
}

.radio-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.radio-box {
    position: relative;
}

.radio-box input {
    display: none;
}

.radio-label {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 22px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.4s;
    overflow: hidden;
    position: relative;
}

.radio-label::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #38bdf8, #8b5cf6, #ec4899);
    opacity: 0;
    transition: 0.4s;
    z-index: -1;
}

.radio-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid #94a3b8;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
    flex-shrink: 0;
}

.radio-circle::after {
    content: "";
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    transform: scale(0);
    transition: 0.3s;
}

.radio-content h3 {
    font-size: 20px;
    margin-bottom: 4px;

}

.radio-content span {
    font-size: 14px;
    color: #cbd5e1;
}

.radio-box input:checked + .radio-label {
    border-color: #8b5cf6;
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
}

.radio-box input:checked + .radio-label::before {
    opacity: 1;
}

.radio-box input:checked + .radio-label .radio-circle {
    border-color: #fff;
}

.radio-box input:checked + .radio-label .radio-circle::after {
    transform: scale(1);
}

.radio-box input:checked + .radio-label .radio-content span {
    color: #f8fafc;
}

.radio-label:hover {
    transform: translateY(-3px);
    border-color: #38bdf8;
}

    </style>
    <!-- ============================================ -->
    
</head>
<body>
    <!-- ============================================ -->
    <!-- HTML CODE (from the HTML editor)             -->
    <!-- ============================================ -->
<div class="container">
    <h2 >Select your Plan</h2>
    <p>Choose the best option for your journey</p>
    <div class="radio-group">
        <div class="radio-box">
            <input type="radio" 
                   name="plan" 
                   id="basic" 
                   checked>
            <label for="basic" class="radio-label">
                <div class="radio-circle"></div>
                <div class="radio-content">
                    <h3>Basic Plan</h3>
                    <span>Perfect for Beginners</span>
                </div>
            </label>
        </div>
        <div class="radio-box">
            <input type="radio" 
                   name="plan" 
                   id="pro">
            <label for="pro" class="radio-label">
                <div class="radio-circle"></div>
                <div class="radio-content">
                    <h3>Pro Plan</h3>
                    <span>Best for Professionals</span>
                </div>
            </label>
        </div>
        <div class="radio-box">
            <input type="radio" 
                   name="plan" 
                   id="premium">
            <label for="premium" class="radio-label">
                <div class="radio-circle"></div>
                <div class="radio-content">
                    <h3>Premium Plan</h3>
                    <span>Unlock all Premium Features</span>
                </div>
            </label>
        </div>
    </div>
</div>

</html>
